name: hop_talk
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.1


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^9.0.0
  get: ^4.7.3
  flutter_svg: ^2.3.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  path: ^1.9.1
  hive_flutter: ^1.1.0
  awesome_snackbar_content: ^0.1.8
  device_info_plus: ^13.3.0
  crypto: ^3.0.8
  uuid: ^4.6.0
  hive: ^2.2.3
  shared_preferences: ^2.5.6
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  hive_generator: ^2.0.1
  build_runner: ^2.4.13


flutter:
  uses-material-design: true
  assets:
    - assets/onboarding/
    - assets/setup_avatars/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf


flutter_native_splash:
  color: "#FCF8FB"
  image: assets/app_icon/splash.png
  fullscreen: true 
  android_12:
    color: "#FCF8FB"
    image: assets/app_icon/splash.png  

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_icon/primary_icon.png"
  min_sdk_android: 21
